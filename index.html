<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Türkiye Gölleri Coğrafya Oyunu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-elevated: #18181b;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --text: #ededef;
      --text-muted: #8e8e93;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.15);
      --correct: #10b981;
      --wrong: #f43f5e;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Minimalist Navigation */
    header {
      padding: 1rem 1.5rem;
      background: rgba(9, 9, 11, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .brand h1 {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #fafafa;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
    }

    .btn-nav {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-nav:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-hover);
    }

    .btn-nav:active {
      transform: scale(0.98);
    }

    main {
      flex: 1;
      padding: 1rem 1.5rem;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Metrics Row */
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
    }

    .metric-item {
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      border-right: 1px solid var(--border);
    }

    .metric-item:last-child {
      border-right: none;
    }

    .metric-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .metric-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.15rem;
      font-weight: 600;
      color: #fafafa;
      margin-top: 2px;
    }

    /* Segmented Control Switcher */
    .segmented-control {
      display: flex;
      background: var(--surface);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
      width: 100%;
    }

    .segment-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .segment-btn.active {
      background: var(--surface-elevated);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Workspace Panel */
    .workspace {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Feedback Banner */
    .toast-status {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      opacity: 0;
      transition: all 0.2s ease;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
    }

    .toast-status.show {
      opacity: 1;
    }

    .toast-status.correct {
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.08);
      color: #34d399;
    }

    .toast-status.wrong {
      border-color: rgba(244, 63, 94, 0.3);
      background: rgba(244, 63, 94, 0.08);
      color: #fb7185;
    }

    .toast-status.info {
      border-color: rgba(99, 102, 241, 0.3);
      background: rgba(99, 102, 241, 0.08);
      color: #818cf8;
    }

    /* Mode 1: Canvas */
    #canvas-view {
      width: 100%;
      height: 420px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.3);
      touch-action: none;
      cursor: grab;
    }

    #game-canvas:active {
      cursor: grabbing;
    }

    /* Overlay FX Canvas */
    #fx-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      width: 100%;
      height: 100%;
    }

    /* Mode 2 & Mode 3 Containers */
    .quiz-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 10px 0;
      position: relative;
    }

    .question-card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 20px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    .question-tag {
      font-size: 0.68rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .question-title {
      font-size: 1.35rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .question-clue {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-block;
      line-height: 1.4;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .option-btn {
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border-hover);
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.15) !important;
      border-color: rgba(16, 185, 129, 0.5) !important;
      color: #34d399 !important;
    }

    .option-btn.wrong {
      background: rgba(244, 63, 94, 0.15) !important;
      border-color: rgba(244, 63, 94, 0.5) !important;
      color: #fb7185 !important;
    }

    /* Modal / Dictionary */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 680px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .dict-card {
      background: var(--surface-elevated);
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
    }

    .dict-card h4 {
      font-size: 0.9rem;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .dict-lakes {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .dict-story {
      font-size: 0.8rem;
      color: #cbd5e1;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 10px;
      border-radius: 6px;
      line-height: 1.45;
      border: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      main {
        padding: 0.6rem;
      }
      .metrics-bar {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
      .metric-item {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding-bottom: 6px;
      }
      .metric-item:nth-child(2), .metric-item:nth-child(4) {
        border-bottom: none;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
      #canvas-view {
        height: 400px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <h1>Türkiye Gölleri</h1>
    </div>
    <div class="nav-actions">
      <button class="btn-nav" id="btn-dict">Kodlamalar</button>
      <button class="btn-nav" id="btn-restart">Sıfırla</button>
    </div>
  </header>

  <main>
    <div class="metrics-bar">
      <div class="metric-item">
        <div class="metric-label">Puan</div>
        <div class="metric-value" id="stat-score">0</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Seri</div>
        <div class="metric-value" id="stat-streak">0</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Doğru / Yanlış</div>
        <div class="metric-value" id="stat-accuracy">0/0</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Kalan</div>
        <div class="metric-value" id="stat-remaining">44</div>
      </div>
    </div>

    <div class="segmented-control">
      <button class="segment-btn active" data-mode="canvas">Sürükle - Bırak</button>
      <button class="segment-btn" data-mode="quiz">Hızlı Test</button>
      <button class="segment-btn" data-mode="mnemonic">Kodlama Eşleştirme</button>
    </div>

    <div class="workspace">
      <canvas id="fx-canvas"></canvas>

      <div class="toast-status" id="toast-status">
        <span id="toast-text">Göl kartını tutup doğru gruba sürükleyin.</span>
        <button class="btn-nav" id="toast-next" style="display:none; padding: 3px 8px; font-size: 0.72rem;">İlerle ➔</button>
      </div>

      <!-- Mode 1: Canvas -->
      <div id="canvas-view">
        <canvas id="game-canvas"></canvas>
      </div>

      <!-- Mode 2: Quiz -->
      <div class="quiz-container" id="quiz-view">
        <div class="question-card" id="quiz-card">
          <div class="question-tag">GÖL KATEGORİSİ</div>
          <div class="question-title" id="quiz-title">Göl Yükleniyor...</div>
          <div class="question-clue" id="quiz-clue">Hikaye: ...</div>
        </div>
        <div class="options-grid" id="quiz-options"></div>
      </div>

      <!-- Mode 3: Mnemonic -->
      <div class="quiz-container" id="mnemonic-view">
        <div class="question-card" id="mnem-card">
          <div class="question-tag">KODLAMA KELİMESİ</div>
          <div class="question-title" id="mnem-title">"Kelime"</div>
          <div class="question-clue">Bu hikaye kelimesi hangi göle aittir?</div>
        </div>
        <div class="options-grid" id="mnem-options"></div>
      </div>
    </div>
  </main>

  <!-- Dictionary Modal -->
  <div class="modal-overlay" id="dict-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="font-size: 1rem; font-weight: 600;">Kodlama Hikayeleri ve Göller</h3>
        <button class="btn-nav" id="close-modal">&times;</button>
      </div>
      <div id="dict-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
  </div>

  <script>
    const LAKES_DATA = [

      // Karstik

      { name: "Elmalı Gölü", type: "Karstik Göller", key: "elma kesip" },

      // Kıyı Set
      { name: "Durugöl", type: "Kıyı Set Gölleri", key: "Duru" },
      { name: "Terkos Gölü", type: "Kıyı Set Gölleri", key: "ter kokuyon" },
      { name: "Akyatan Gölü", type: "Kıyı Set Gölleri", key: "yatağın yanındaki" },
      { name: "Büyükçekmece", type: "Kıyı Set Gölleri", key: "çekmecelere bak" },
      { name: "Küçükçekmece", type: "Kıyı Set Gölleri", key: "çekmecelere bak" },

      // Volkanik
      { name: "Meke Gölü", type: "Volkanik Göller", key: "Mete" },
      { name: "Acıgöl (Nevşehir)", type: "Volkanik Göller", key: "acıklı bir hayata" },

      // Volkanik Set
      { name: "Van Gölü", type: "Volkanik Set Gölleri", key: "Van'da yaşayan" },
      { name: "Nazik Gölü", type: "Volkanik Set Gölleri", key: "nazik bir erkek" },
      { name: "Erçek Gölü", type: "Volkanik Set Gölleri", key: "erkek balığı" },
      { name: "Balık Gölü", type: "Volkanik Set Gölleri", key: "erkek balığı" },
      { name: "Haçlı Gölü", type: "Volkanik Set Gölleri", key: "haçlı adama" },
      { name: "Çıldır Gölü", type: "Volkanik Set Gölleri", key: "çıldırmış adama" }
    ];

    const CATEGORIES = [
      { name: "Tektonik Göller", color: "#6366f1", story: "Tonluk taş (Aktaş) alıp Ulubat Bey'den (Ulubat & Beyşehir) boynumuzu eğerek (Eğirdir) izin (İznik) alıp sapanla (Sapanca) manyak (Manyas) ve ak tüylü (Akşehir) kuşu vurup gebertiyoruz (Eber). Sonra keyifli (Seyfe) bir şekilde azar azar (Hazar) tuzluyoruz (Tuz). Ama tuzu atan abartıyor bir dur bir dur (Burdur) diye bağırıyoruz çünkü acı (Acıgöl) oluyor kuşun tadı." },
      { name: "Heyelan Set Gölleri", color: "#10b981", story: "HEY LAN Bora Bey (Borabay) izin (Zinav) alsana serayı (Sera) hortumla (Tortum) abartılı (Abant) bir şekilde yedi gün boyunca (Yedigöller) sulamadan önce sülük (Sülüklü) gibisin aynı." },
      { name: "Alüvyal Set Gölleri", color: "#f59e0b", story: "Ali köyde (Köyceğiz) çamların içinde (Çamiçi/Bafa) mermerin (Marmara) üstünde yatıyor. Uzun (Uzungöl) bir yorganım (Mogan) olsa keşke diyor. Ona emir (Eymir) verip kalkmasını söylüyoruz. Bide Gala/Yala/Çeltik var." },
      { name: "Karstik Göller", color: "#ec4899", story: "Karılarımızı alak da sulak (Suğla) alanda elma kesip (Elmalı & Kestel) yerken sala binip (Salda) balık avlayalım (Avlan)." },
      { name: "Kıyı Set Gölleri", color: "#8b5cf6", story: "Duru (Durugöl) leş gibi ter kokuyon (Terkos) git de yatağın (Akyatan/Ağyatan) yanındaki çekmecelere bak (Büyükçekmece & Küçükçekmece) deodorant var orda." },
      { name: "Volkanik Göller", color: "#f43f5e", story: "Mete (Meke) acıklı (Acıgöl) bir hayata sahip olduğu için nemrut suratlı (Nemrut) biraz gülücük (Gölcük) lazım." },
      { name: "Volkanik Set Gölleri", color: "#06b6d4", story: "Van'da yaşayan (Van) nazik (Nazik) bir erkek (Erçek) balığı (Balık) çıldırmış haçlı adama fırlatıyor (Haçlı & Çıldır)." }
    ];

    // Minimal Web Audio Chime
    class SoundManager {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      playCorrect() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.12);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.25);
      }
      playWrong() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(130, t + 0.2);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      }
    }

    const sound = new SoundManager();

    // COOKIE / SESSION PERSISTENCE HELPERS
    const COOKIE_NAME = 'cografya_golleri_progress';

    function setProgressCookie(data) {
      try {
        const json = JSON.stringify(data);
        const encoded = encodeURIComponent(json);
        document.cookie = `${COOKIE_NAME}=${encoded}; path=/; max-age=2592000; SameSite=Lax`;
        localStorage.setItem(COOKIE_NAME, json); // fallback
      } catch (e) {
        console.error("Cookie write error:", e);
      }
    }

    function getProgressCookie() {
      try {
        const matches = document.cookie.match(new RegExp('(?:^|; )' + COOKIE_NAME.replace(/([\.$?*|{}()[\]\\\/+^])/g, '\\$1') + '=([^;]*)'));
        if (matches) {
          return JSON.parse(decodeURIComponent(matches[1]));
        }
        const local = localStorage.getItem(COOKIE_NAME);
        if (local) return JSON.parse(local);
      } catch (e) {
        console.error("Cookie read error:", e);
      }
      return null;
    }

    function clearProgressCookie() {
      document.cookie = `${COOKIE_NAME}=; path=/; max-age=0`;
      localStorage.removeItem(COOKIE_NAME);
    }

    // STATE
    let currentMode = 'canvas';
    let score = 0;
    let streak = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let remainingPool = [...LAKES_DATA];
    let activeLake = null;
    let currentQuizItem = null;

    function saveState() {
      const state = {
        score,
        streak,
        correctCount,
        wrongCount,
        remainingLakeNames: remainingPool.map(l => l.name)
      };
      setProgressCookie(state);
    }

    function loadState() {
      const saved = getProgressCookie();
      if (saved) {
        score = saved.score || 0;
        streak = saved.streak || 0;
        correctCount = saved.correctCount || 0;
        wrongCount = saved.wrongCount || 0;
        if (Array.isArray(saved.remainingLakeNames) && saved.remainingLakeNames.length > 0) {
          remainingPool = LAKES_DATA.filter(l => saved.remainingLakeNames.includes(l.name));
          if (remainingPool.length === 0) remainingPool = [...LAKES_DATA];
        }
        showToast("Önceki ilerlemeniz çerezlerden yüklendi.", true);
        return true;
      }
      return false;
    }

    // DOM
    const statScore = document.getElementById('stat-score');
    const statStreak = document.getElementById('stat-streak');
    const statAccuracy = document.getElementById('stat-accuracy');
    const statRemaining = document.getElementById('stat-remaining');
    const toastStatus = document.getElementById('toast-status');
    const toastText = document.getElementById('toast-text');
    const toastNext = document.getElementById('toast-next');

    // SEGMENTED SWITCH
    document.querySelectorAll('.segment-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;

        document.getElementById('canvas-view').style.display = currentMode === 'canvas' ? 'flex' : 'none';
        document.getElementById('quiz-view').style.display = currentMode === 'quiz' ? 'flex' : 'none';
        document.getElementById('mnemonic-view').style.display = currentMode === 'mnemonic' ? 'flex' : 'none';

        initMode();
      });
    });

    function updateStats() {
      statScore.textContent = score;
      statStreak.textContent = streak;
      statAccuracy.textContent = `${correctCount}/${wrongCount}`;
      statRemaining.textContent = remainingPool.length;
    }

    function showToast(msg, isCorrect, showNext = false) {
      toastStatus.className = `toast-status show ${isCorrect ? 'correct' : 'wrong'}`;
      toastText.textContent = msg;
      toastNext.style.display = showNext ? 'inline-block' : 'none';
    }

    function hideToast() {
      toastStatus.className = 'toast-status';
    }

    // OVERLAY FX CANVAS
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    let fxParticles = [];

    function resizeFxCanvas() {
      const rect = fxCanvas.parentElement.getBoundingClientRect();
      fxCanvas.width = rect.width;
      fxCanvas.height = rect.height;
    }
    window.addEventListener('resize', resizeFxCanvas);

    function triggerGlobalExplosion(x, y) {
      resizeFxCanvas();
      const colors = ['#6366f1', '#10b981', '#38bdf8', '#ffffff'];
      for (let i = 0; i < 30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        fxParticles.push({
          x: x || fxCanvas.width / 2,
          y: y || fxCanvas.height / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          gravity: 0.12,
          friction: 0.96,
          radius: Math.random() * 2.5 + 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          life: 25
        });
      }
    }

    function renderFxCanvas() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      fxParticles.forEach((p, idx) => {
        fxCtx.save();
        fxCtx.globalAlpha = p.alpha;
        fxCtx.fillStyle = p.color;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();

        p.x += p.vx; p.y += p.vy;
        p.vx *= p.friction; p.vy *= p.friction;
        p.vy += p.gravity;
        p.alpha -= 1 / p.life;
        if (p.alpha <= 0) fxParticles.splice(idx, 1);
      });
      requestAnimationFrame(renderFxCanvas);
    }
    renderFxCanvas();

    // CANVAS ENGINE (MODE 1)
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let buckets = [];
    let particles = [];
    let floatingTexts = [];
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      setupBuckets();
    }
    window.addEventListener('resize', resizeCanvas);

    function setupBuckets() {
      buckets = [];
      const isMobile = window.innerWidth <= 640;
      const cols = isMobile ? 2 : 4;
      const padX = isMobile ? 8 : 12;
      const padY = isMobile ? 6 : 10;
      const bWidth = (canvas.width - (cols + 1) * padX) / cols;
      const bHeight = isMobile ? 50 : 60;
      const rows = Math.ceil(CATEGORIES.length / cols);
      const startY = canvas.height - (rows * (bHeight + padY)) - 10;

      CATEGORIES.forEach((cat, idx) => {
        const col = idx % cols;
        const row = Math.floor(idx / cols);
        const x = padX + col * (bWidth + padX);
        const y = startY + row * (bHeight + padY);

        buckets.push({ ...cat, x, y, w: bWidth, h: bHeight, pulse: 0 });
      });
    }

    function spawnNextLake() {
      if (remainingPool.length === 0) remainingPool = [...LAKES_DATA];
      const idx = Math.floor(Math.random() * remainingPool.length);
      const lake = remainingPool[idx];

      const isMobile = window.innerWidth <= 640;
      activeLake = {
        ...lake,
        x: canvas.width / 2,
        y: isMobile ? 45 : 55,
        w: 120,
        h: 36
      };
    }

    function triggerExplosion(x, y, baseColor) {
      for (let i = 0; i < 25; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          gravity: 0.15,
          friction: 0.96,
          radius: Math.random() * 2.5 + 1,
          color: baseColor,
          alpha: 1,
          life: 25
        });
      }
    }

    function addFloatingText(x, y, text, color) {
      floatingTexts.push({ x, y, text, color, alpha: 1, vy: -1.8 });
    }

    function renderCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#8e8e93';
      ctx.font = '500 11px "Inter"';
      ctx.textAlign = 'center';
      ctx.fillText("Göl kartını tutup doğru gruba sürükleyin", canvas.width / 2, 18);

      // Draw Buckets
      buckets.forEach(b => {
        ctx.save();
        if (b.pulse > 0) {
          b.pulse -= 0.05;
          ctx.shadowColor = b.color;
          ctx.shadowBlur = 12 * b.pulse;
        }

        ctx.fillStyle = '#18181b';
        ctx.strokeStyle = b.pulse > 0 ? b.color : 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = b.pulse > 0 ? 1.5 : 1;

        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ededef';
        ctx.font = '500 11.5px "Inter"';
        ctx.textAlign = 'center';
        ctx.fillText(b.name, b.x + b.w / 2, b.y + b.h / 2 + 4);
        ctx.restore();
      });

      // Particles
      particles.forEach((p, idx) => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        p.x += p.vx; p.y += p.vy;
        p.vx *= p.friction; p.vy *= p.friction;
        p.vy += p.gravity;
        p.alpha -= 1 / p.life;
        if (p.alpha <= 0) particles.splice(idx, 1);
      });

      // Floating Texts
      floatingTexts.forEach((ft, idx) => {
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.fillStyle = ft.color;
        ctx.font = '600 13px "Inter"';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();

        ft.y += ft.vy;
        ft.alpha -= 0.035;
        if (ft.alpha <= 0) floatingTexts.splice(idx, 1);
      });

      // Active Floating Lake Card
      if (activeLake) {
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 12;

        ctx.fillStyle = '#27272a';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1;

        const rx = activeLake.x - activeLake.w / 2;
        const ry = activeLake.y - activeLake.h / 2;

        ctx.beginPath();
        ctx.roundRect(rx, ry, activeLake.w, activeLake.h, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '600 12px "Inter"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(activeLake.name, activeLake.x, activeLake.y);

        ctx.restore();
      }

      requestAnimationFrame(renderCanvas);
    }

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function handleStart(e) {
      if (!activeLake) return;
      const pos = getCanvasCoords(e);
      const rx = activeLake.x - activeLake.w / 2;
      const ry = activeLake.y - activeLake.h / 2;

      if (pos.x >= rx && pos.x <= rx + activeLake.w && pos.y >= ry && pos.y <= ry + activeLake.h) {
        isDragging = true;
        dragOffset.x = pos.x - activeLake.x;
        dragOffset.y = pos.y - activeLake.y;
      }
    }

    function handleMove(e) {
      if (!isDragging || !activeLake) return;
      e.preventDefault();
      const pos = getCanvasCoords(e);
      activeLake.x = pos.x - dragOffset.x;
      activeLake.y = pos.y - dragOffset.y;
    }

    function handleEnd() {
      if (!isDragging || !activeLake) return;
      isDragging = false;

      let hitBucket = null;
      buckets.forEach(b => {
        if (
          activeLake.x > b.x && activeLake.x < b.x + b.w &&
          activeLake.y > b.y && activeLake.y < b.y + b.h
        ) {
          hitBucket = b;
        }
      });

      const isMobile = window.innerWidth <= 640;
      const resetY = isMobile ? 45 : 55;

      if (hitBucket) {
        if (hitBucket.name === activeLake.type) {
          sound.playCorrect();
          const earnedScore = 10 + streak * 2;
          score += earnedScore;
          streak++;
          correctCount++;

          hitBucket.pulse = 1;
          triggerExplosion(activeLake.x, activeLake.y, hitBucket.color);
          addFloatingText(hitBucket.x + hitBucket.w / 2, hitBucket.y - 8, `+${earnedScore}`, '#34d399');

          showToast(`Doğru: ${activeLake.name} ➔ ${activeLake.type}`, true);
          remainingPool = remainingPool.filter(l => l.name !== activeLake.name);
          
          saveState(); // Save to Cookie
          updateStats();

          activeLake = null;
          setTimeout(spawnNextLake, 400);
        } else {
          sound.playWrong();
          streak = 0;
          wrongCount++;
          addFloatingText(hitBucket.x + hitBucket.w / 2, hitBucket.y - 8, `Yanlış`, '#fb7185');
          showToast(`Yanlış: ${activeLake.name} bir ${activeLake.type} örneğidir.`, false);
          
          saveState(); // Save to Cookie
          updateStats();
          activeLake.x = canvas.width / 2;
          activeLake.y = resetY;
        }
      } else {
        activeLake.x = canvas.width / 2;
        activeLake.y = resetY;
      }
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', handleStart, { passive: false });
    canvas.addEventListener('touchmove', handleMove, { passive: false });
    canvas.addEventListener('touchend', handleEnd);

    // MODE 2: QUIZ
    function setupQuiz() {
      hideToast();
      if (remainingPool.length === 0) remainingPool = [...LAKES_DATA];
      currentQuizItem = remainingPool[Math.floor(Math.random() * remainingPool.length)];

      document.getElementById('quiz-title').textContent = currentQuizItem.name;
      document.getElementById('quiz-clue').textContent = `Hikaye: "...${currentQuizItem.key}..."`;

      const grid = document.getElementById('quiz-options');
      grid.innerHTML = '';

      CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = cat.name;
        btn.onclick = (e) => checkQuiz(cat.name, btn, e);
        grid.appendChild(btn);
      });
    }

    function checkQuiz(selected, btn, e) {
      const btns = document.querySelectorAll('#quiz-options .option-btn');
      btns.forEach(b => b.style.pointerEvents = 'none');

      if (selected === currentQuizItem.type) {
        btn.classList.add('correct');
        sound.playCorrect();
        score += 15;
        streak++;
        correctCount++;

        const rect = btn.getBoundingClientRect();
        triggerGlobalExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);

        showToast(`Doğru: ${currentQuizItem.name} ➔ ${currentQuizItem.type}`, true, true);
        remainingPool = remainingPool.filter(l => l.name !== currentQuizItem.name);
      } else {
        btn.classList.add('wrong');
        sound.playWrong();
        streak = 0;
        wrongCount++;
        btns.forEach(b => { if (b.textContent === currentQuizItem.type) b.classList.add('correct'); });
        showToast(`Yanlış: ${currentQuizItem.name} bir ${currentQuizItem.type} örneğidir.`, false, true);
      }
      saveState(); // Save Cookie
      updateStats();
    }

    // MODE 3: MNEMONIC
    function setupMnemonic() {
      hideToast();
      if (remainingPool.length === 0) remainingPool = [...LAKES_DATA];
      currentQuizItem = remainingPool[Math.floor(Math.random() * remainingPool.length)];

      document.getElementById('mnem-title').textContent = `"${currentQuizItem.key}"`;

      const grid = document.getElementById('mnem-options');
      grid.innerHTML = '';

      let choices = [currentQuizItem];
      while (choices.length < 4) {
        const r = LAKES_DATA[Math.floor(Math.random() * LAKES_DATA.length)];
        if (!choices.some(c => c.name === r.name)) choices.push(r);
      }
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = item.name;
        btn.onclick = (e) => checkMnemonic(item.name, btn, e);
        grid.appendChild(btn);
      });
    }

    function checkMnemonic(selectedName, btn, e) {
      const btns = document.querySelectorAll('#mnem-options .option-btn');
      btns.forEach(b => b.style.pointerEvents = 'none');

      if (selectedName === currentQuizItem.name) {
        btn.classList.add('correct');
        sound.playCorrect();
        score += 20;
        streak++;
        correctCount++;

        const rect = btn.getBoundingClientRect();
        triggerGlobalExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);

        showToast(`Doğru: "${currentQuizItem.key}" ➔ ${currentQuizItem.name}`, true, true);
      } else {
        btn.classList.add('wrong');
        sound.playWrong();
        streak = 0;
        wrongCount++;
        btns.forEach(b => { if (b.textContent === currentQuizItem.name) b.classList.add('correct'); });
        showToast(`Yanlış: "${currentQuizItem.key}" kodlaması ${currentQuizItem.name} içindir.`, false, true);
      }
      saveState(); // Save Cookie
      updateStats();
    }

    toastNext.onclick = () => {
      if (currentMode === 'quiz') setupQuiz();
      if (currentMode === 'mnemonic') setupMnemonic();
    };

    function initMode() {
      hideToast();
      if (currentMode === 'canvas') { resizeCanvas(); spawnNextLake(); }
      else if (currentMode === 'quiz') { setupQuiz(); }
      else if (currentMode === 'mnemonic') { setupMnemonic(); }
    }

    // DICTIONARY MODAL
    const modal = document.getElementById('dict-modal');
    document.getElementById('btn-dict').onclick = () => {
      const list = document.getElementById('dict-list');
      list.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const lakes = LAKES_DATA.filter(l => l.type === cat.name).map(l => l.name).join(', ');
        const card = document.createElement('div');
        card.className = 'dict-card';
        card.innerHTML = `
          <h4 style="color: ${cat.color}">${cat.name}</h4>
          <div class="dict-lakes"><strong>Göller:</strong> ${lakes}</div>
          <div class="dict-story"><strong>Kodlama:</strong> ${cat.story}</div>
        `;
        list.appendChild(card);
      });
      modal.style.display = 'flex';
    };

    document.getElementById('close-modal').onclick = () => modal.style.display = 'none';

    // RESET BUTTON (Clears Cookie & Resets State)
    document.getElementById('btn-restart').onclick = () => {
      clearProgressCookie();
      score = 0; streak = 0; correctCount = 0; wrongCount = 0;
      remainingPool = [...LAKES_DATA];
      updateStats();
      showToast("İlerlemeniz ve çerezler sıfırlandı.", false);
      initMode();
    };

    // INITIAL LAUNCH WITH COOKIE RESTORE
    const hasLoaded = loadState();
    updateStats();
    setTimeout(() => {
      resizeCanvas();
      spawnNextLake();
      renderCanvas();
    }, 100);
  </script>
</body>
</html>

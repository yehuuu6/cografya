
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Türkiye Gölleri - Minimalist Coğrafya Oyunu</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(21, 29, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.06) 0%, transparent 40%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.9rem 1.8rem;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .logo h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #f8fafc;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 7px 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-accent {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }

    .btn-accent:hover {
      background: rgba(56, 189, 248, 0.25);
    }

    main {
      flex: 1;
      padding: 1.2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* Minimal Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 14px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
    }

    /* Mode Navigation Tabs */
    .mode-switch {
      display: flex;
      justify-content: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      width: fit-content;
      margin: 0 auto;
    }

    .tab-btn {
      padding: 8px 16px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Game Area Container */
    .game-area {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Feedback Banner */
    .feedback-toast {
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      opacity: 0;
      transition: opacity 0.25s ease;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid transparent;
    }

    .feedback-toast.show {
      opacity: 1;
    }

    .feedback-toast.correct {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .feedback-toast.wrong {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    /* Mode 1: Canvas */
    #canvas-view {
      width: 100%;
      height: 480px;
      display: flex;
      flex-direction: column;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      background: rgba(9, 13, 22, 0.6);
      touch-action: none;
      cursor: grab;
    }

    #game-canvas:active {
      cursor: grabbing;
    }

    /* Mode 2: Quiz & Mode 3: Mnemonic */
    .quiz-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 680px;
      margin: 40px auto;
      width: 100%;
    }

    .question-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      text-align: center;
    }

    .question-tag {
      font-size: 0.75rem;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .question-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 10px;
    }

    .question-clue {
      font-size: 0.88rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 8px;
      display: inline-block;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      width: 100%;
    }

    .option-btn {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .option-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.2) !important;
      border-color: #10b981 !important;
      color: #34d399 !important;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: #ef4444 !important;
      color: #f87171 !important;
    }

    /* Modal / Dictionary */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 800px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    .dict-card {
      background: rgba(30, 41, 59, 0.4);
      border-radius: 12px;
      padding: 14px;
      border-left: 4px solid #38bdf8;
    }

    .dict-card h4 {
      font-size: 0.98rem;
      margin-bottom: 4px;
    }

    .dict-lakes {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .dict-story {
      font-size: 0.85rem;
      color: #cbd5e1;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 12px;
      border-radius: 8px;
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      .stats-bar {
        grid-template-columns: repeat(2, 1fr);
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-badge">🌊</div>
      <h1>Türkiye Gölleri</h1>
    </div>
    <div class="nav-actions">
      <button class="btn" id="btn-dict">📖 Kodlama Sözlüğü</button>
      <button class="btn btn-accent" id="btn-restart">🔄 Sıfırla</button>
    </div>
  </header>

  <main>
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Puan</div>
        <div class="stat-value" id="stat-score">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Seri</div>
        <div class="stat-value" id="stat-streak">🔥 0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Doğru / Yanlış</div>
        <div class="stat-value" id="stat-accuracy">0 / 0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Kalan</div>
        <div class="stat-value" id="stat-remaining">44</div>
      </div>
    </div>

    <div class="mode-switch">
      <button class="tab-btn active" data-mode="canvas">🎯 Sürükle - Bırak</button>
      <button class="tab-btn" data-mode="quiz">⚡ Hızlı Test</button>
      <button class="tab-btn" data-mode="mnemonic">🧩 Kodlama Eşleştirme</button>
    </div>

    <div class="game-area">
      <div class="feedback-toast" id="feedback-toast">
        <span id="feedback-text">Göl balonunu tutup doğru oluşum kutusuna bırakın.</span>
        <button class="btn btn-accent" id="feedback-next" style="display:none; padding: 4px 10px; font-size: 0.75rem;">Sonraki ➔</button>
      </div>

      <!-- Mode 1: Canvas -->
      <div id="canvas-view">
        <canvas id="game-canvas"></canvas>
      </div>

      <!-- Mode 2: Quiz -->
      <div class="quiz-container" id="quiz-view">
        <div class="question-card">
          <div class="question-tag">GÖL HANGİ TÜRDE?</div>
          <div class="question-title" id="quiz-title">Göl Yükleniyor...</div>
          <div class="question-clue" id="quiz-clue">💡 İpucu: ...</div>
        </div>
        <div class="options-grid" id="quiz-options"></div>
      </div>

      <!-- Mode 3: Mnemonic -->
      <div class="quiz-container" id="mnemonic-view">
        <div class="question-card">
          <div class="question-tag">KODLAMA KELİMESİ</div>
          <div class="question-title" id="mnem-title">"Kelime"</div>
          <div class="question-clue">Bu hikaye kelimesi hangi göle aittir?</div>
        </div>
        <div class="options-grid" id="mnem-options"></div>
      </div>
    </div>
  </main>

  <!-- Dictionary Modal -->
  <div class="modal-overlay" id="dict-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>📖 Tüm Göller ve Kodlamaları</h3>
        <button class="btn" id="close-modal">&times;</button>
      </div>
      <div id="dict-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>
  </div>

  <script>
    const LAKES_DATA = [
      // Tektonik
      { name: "Aktaş Gölü", type: "Tektonik Göller", key: "Tonluk taş" },
      { name: "Ulubat Gölü", type: "Tektonik Göller", key: "Ulubat Bey" },
      { name: "Beyşehir Gölü", type: "Tektonik Göller", key: "Ulubat Bey" },
      { name: "Eğirdir Gölü", type: "Tektonik Göller", key: "boynumuzu eğerek" },
      { name: "İznik Gölü", type: "Tektonik Göller", key: "izin alıp" },
      { name: "Sapanca Gölü", type: "Tektonik Göller", key: "sapanla" },
      { name: "Manyas Gölü", type: "Tektonik Göller", key: "manyak kuşu" },

      { name: "Eber Gölü", type: "Tektonik Göller", key: "gebertiyoruz" },
      { name: "Seyfe Gölü", type: "Tektonik Göller", key: "keyifli şekilde" },
      { name: "Hazar Gölü", type: "Tektonik Göller", key: "azar azar" },
      { name: "Tuz Gölü", type: "Tektonik Göller", key: "tuzluyoruz" },
      { name: "Burdur Gölü", type: "Tektonik Göller", key: "bir dur bir dur" },
      { name: "Acıgöl (Denizli)", type: "Tektonik Göller", key: "acı oluyor kuşun tadı" },

      // Heyelan Set
      { name: "Borabay Gölü", type: "Heyelan Set Gölleri", key: "HEY LAN Bora Bey" },
      { name: "Zinav Gölü", type: "Heyelan Set Gölleri", key: "izin alsana" },
      { name: "Sera Gölü", type: "Heyelan Set Gölleri", key: "serayı" },
      { name: "Tortum Gölü", type: "Heyelan Set Gölleri", key: "hortumla" },
      { name: "Abant Gölü", type: "Heyelan Set Gölleri", key: "abartılı şekilde" },
      { name: "Yedigöller", type: "Heyelan Set Gölleri", key: "yedi gün boyunca" },
      { name: "Sülüklü Gölü", type: "Heyelan Set Gölleri", key: "sülük gibisin" },

      // Alüvyal Set
      { name: "Köyceğiz Gölü", type: "Alüvyal Set Gölleri", key: "Ali köyde" },
      { name: "Çamiçi (Bafa)", type: "Alüvyal Set Gölleri", key: "çamların içinde" },
      { name: "Marmara Gölü", type: "Alüvyal Set Gölleri", key: "mermerin üstünde" },
      { name: "Uzungöl", type: "Alüvyal Set Gölleri", key: "uzun bir yorganım" },
      { name: "Mogan Gölü", type: "Alüvyal Set Gölleri", key: "yorganım olsa" },
      { name: "Eymir Gölü", type: "Alüvyal Set Gölleri", key: "emir verip" },
      { name: "Gala Gölü", type: "Alüvyal Set Gölleri", key: "Engin hocanın Gala gölü" },

      // Karstik
      { name: "Suğla Gölü", type: "Karstik Göller", key: "sulak alanda" },
      { name: "Elmalı Gölü", type: "Karstik Göller", key: "elma kesip" },
      { name: "Kestel Gölü", type: "Karstik Göller", key: "elma kesip (kestel)" },
      { name: "Salda Gölü", type: "Karstik Göller", key: "sala binip" },
      { name: "Avlan Gölü", type: "Karstik Göller", key: "balık avlayalım" },

      // Kıyı Set
      { name: "Durugöl", type: "Kıyı Set Gölleri", key: "Duru" },
      { name: "Terkos Gölü", type: "Kıyı Set Gölleri", key: "ter kokuyon" },
      { name: "Akyatan Gölü", type: "Kıyı Set Gölleri", key: "yatağın yanındaki" },
      { name: "Büyükçekmece", type: "Kıyı Set Gölleri", key: "çekmecelere bak" },
      { name: "Küçükçekmece", type: "Kıyı Set Gölleri", key: "çekmecelere bak" },

      // Volkanik
      { name: "Meke Gölü", type: "Volkanik Göller", key: "Mete" },
      { name: "Acıgöl (Nevşehir)", type: "Volkanik Göller", key: "acıklı bir hayata" },
      { name: "Nemrut Gölü", type: "Volkanik Göller", key: "nemrut suratlı" },
      { name: "Gölcük Gölü", type: "Volkanik Göller", key: "gülücük lazım" },

      // Volkanik Set
      { name: "Van Gölü", type: "Volkanik Set Gölleri", key: "Van'da yaşayan" },
      { name: "Nazik Gölü", type: "Volkanik Set Gölleri", key: "nazik bir erkek" },
      { name: "Erçek Gölü", type: "Volkanik Set Gölleri", key: "erkek balığı" },
      { name: "Balık Gölü", type: "Volkanik Set Gölleri", key: "erkek balığı" },
      { name: "Haçlı Gölü", type: "Volkanik Set Gölleri", key: "haçlı adama" },
      { name: "Çıldır Gölü", type: "Volkanik Set Gölleri", key: "çıldırmış adama" }
    ];

    const CATEGORIES = [
      { name: "Tektonik Göller", color: "#38bdf8", story: "Tonluk taş (Aktaş) alıp Ulubat Bey'den (Ulubat & Beyşehir) boynumuzu eğerek (Eğirdir) izin (İznik) alıp sapanla (Sapanca) manyak (Manyas) ve ak tüylü (Akşehir) kuşu vurup gebertiyoruz (Eber). Sonra keyifli (Seyfe) bir şekilde azar azar (Hazar) tuzluyoruz (Tuz). Ama tuzu atan abartıyor bir dur bir dur (Burdur) diye bağırıyoruz çünkü acı (Acıgöl) oluyor kuşun tadı." },
      { name: "Heyelan Set Gölleri", color: "#34d399", story: "HEY LAN Bora Bey (Borabay) izin (Zinav) alsana serayı (Sera) hortumla (Tortum) abartılı (Abant) bir şekilde yedi gün boyunca (Yedigöller) sulamadan önce sülük (Sülüklü) gibisin aynı." },
      { name: "Alüvyal Set Gölleri", color: "#fbbf24", story: "Ali köyde (Köyceğiz) çamların içinde (Çamiçi/Bafa) mermerin (Marmara) üstünde yatıyor. Uzun (Uzungöl) bir yorganım (Mogan) olsa keşke diyor. Ona emir (Eymir) verip kalkmasını söylüyoruz. Bide Gala/Yala/Çeltik var." },
      { name: "Karstik Göller", color: "#f472b6", story: "Karılarımızı alak da sulak (Suğla) alanda elma kesip (Elmalı & Kestel) yerken sala binip (Salda) balık avlayalım (Avlan)." },
      { name: "Kıyı Set Gölleri", color: "#a78bfa", story: "Duru (Durugöl) leş gibi ter kokuyon (Terkos) git de yatağın (Akyatan/Ağyatan) yanındaki çekmecelere bak (Büyükçekmece & Küçükçekmece) deodorant var orda." },
      { name: "Volkanik Göller", color: "#f87171", story: "Mete (Meke) acıklı (Acıgöl) bir hayata sahip olduğu için nemrut suratlı (Nemrut) biraz gülücük (Gölcük) lazım." },
      { name: "Volkanik Set Gölleri", color: "#22d3ee", story: "Van'da yaşayan (Van) nazik (Nazik) bir erkek (Erçek) balığı (Balık) çıldırmış haçlı adama fırlatıyor (Haçlı & Çıldır)." }
    ];

    // Web Audio Synthesizer
    class SoundManager {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      playCorrect() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(587.33, this.ctx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }
      playWrong() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }
    }

    const sound = new SoundManager();

    // GAME STATE
    let currentMode = 'canvas';
    let score = 0;
    let streak = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let remainingPool = [...LAKES_DATA];
    let activeLake = null;
    let currentQuizItem = null;

    // DOM ELEMENTS
    const statScore = document.getElementById('stat-score');
    const statStreak = document.getElementById('stat-streak');
    const statAccuracy = document.getElementById('stat-accuracy');
    const statRemaining = document.getElementById('stat-remaining');
    const feedbackToast = document.getElementById('feedback-toast');
    const feedbackText = document.getElementById('feedback-text');
    const feedbackNext = document.getElementById('feedback-next');

    // TAB SWITCHING
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;

        document.getElementById('canvas-view').style.display = currentMode === 'canvas' ? 'flex' : 'none';
        document.getElementById('quiz-view').style.display = currentMode === 'quiz' ? 'flex' : 'none';
        document.getElementById('mnemonic-view').style.display = currentMode === 'mnemonic' ? 'flex' : 'none';

        initMode();
      });
    });

    function updateStats() {
      statScore.textContent = score;
      statStreak.textContent = `🔥 ${streak}`;
      statAccuracy.textContent = `${correctCount} / ${wrongCount}`;
      statRemaining.textContent = remainingPool.length;
    }

    function showToast(msg, isCorrect, showNext = false) {
      feedbackToast.className = `feedback-toast show ${isCorrect ? 'correct' : 'wrong'}`;
      feedbackText.textContent = msg;
      feedbackNext.style.display = showNext ? 'inline-block' : 'none';
    }

    function hideToast() {
      feedbackToast.className = 'feedback-toast';
    }

    // --- CANVAS ENGINE ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let buckets = [];
    let particles = [];
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      setupBuckets();
    }

    window.addEventListener('resize', resizeCanvas);

    function setupBuckets() {
      buckets = [];
      const cols = 4;
      const padX = 12;
      const padY = 10;
      const bWidth = (canvas.width - (cols + 1) * padX) / cols;
      const bHeight = 68;
      const startY = canvas.height - 160;

      CATEGORIES.forEach((cat, idx) => {
        const col = idx % cols;
        const row = Math.floor(idx / cols);
        const x = padX + col * (bWidth + padX);
        const y = startY + row * (bHeight + padY);

        buckets.push({ ...cat, x, y, w: bWidth, h: bHeight });
      });
    }

    function spawnNextLake() {
      if (remainingPool.length === 0) remainingPool = [...LAKES_DATA];
      const idx = Math.floor(Math.random() * remainingPool.length);
      const lake = remainingPool[idx];

      // MINIMALISTIC COMPACT PILL / BUBBLE RADIUS (Radius: 38px)
      activeLake = {
        ...lake,
        x: canvas.width / 2,
        y: 65,
        radius: 38
      };
    }

    function addParticles(x, y, color) {
      for (let i = 0; i < 14; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          radius: Math.random() * 3 + 1.5,
          color,
          alpha: 1,
          life: 25
        });
      }
    }

    function renderCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Top guide text
      ctx.fillStyle = '#64748b';
      ctx.font = '500 12px "Plus Jakarta Sans"';
      ctx.textAlign = 'center';
      ctx.fillText("Gölü tutup aşağıdaki oluşum kutularından birine bırakın", canvas.width / 2, 22);

      // Draw Buckets
      buckets.forEach(b => {
        ctx.save();
        ctx.fillStyle = b.color + '15';
        ctx.strokeStyle = b.color + '60';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 10);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = b.color;
        ctx.font = '600 11.5px "Plus Jakarta Sans"';
        ctx.textAlign = 'center';
        ctx.fillText(b.name, b.x + b.w / 2, b.y + b.h / 2 + 4);
        ctx.restore();
      });

      // Particles
      particles.forEach((p, idx) => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 1 / p.life;
        if (p.alpha <= 0) particles.splice(idx, 1);
      });

      // Active Lake Bubble (MINIMAL COMPACT)
      if (activeLake) {
        ctx.save();
        
        // Soft Glow
        ctx.shadowColor = 'rgba(56, 189, 248, 0.25)';
        ctx.shadowBlur = 10;

        // Elegant Pill Shape / Circle
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.arc(activeLake.x, activeLake.y, activeLake.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Text inside bubble
        ctx.fillStyle = '#f8fafc';
        ctx.font = '600 12px "Plus Jakarta Sans"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        // Wrap text if needed
        const words = activeLake.name.split(' ');
        if (words.length > 1 && activeLake.name.length > 10) {
          ctx.fillText(words[0], activeLake.x, activeLake.y - 7);
          ctx.fillText(words.slice(1).join(' '), activeLake.x, activeLake.y + 7);
        } else {
          ctx.fillText(activeLake.name, activeLake.x, activeLake.y);
        }

        ctx.restore();
      }

      requestAnimationFrame(renderCanvas);
    }

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function handleStart(e) {
      if (!activeLake) return;
      const pos = getCanvasCoords(e);
      const dist = Math.hypot(pos.x - activeLake.x, pos.y - activeLake.y);
      if (dist < activeLake.radius) {
        isDragging = true;
        dragOffset.x = pos.x - activeLake.x;
        dragOffset.y = pos.y - activeLake.y;
      }
    }

    function handleMove(e) {
      if (!isDragging || !activeLake) return;
      e.preventDefault();
      const pos = getCanvasCoords(e);
      activeLake.x = pos.x - dragOffset.x;
      activeLake.y = pos.y - dragOffset.y;
    }

    function handleEnd() {
      if (!isDragging || !activeLake) return;
      isDragging = false;

      let hitBucket = null;
      buckets.forEach(b => {
        if (
          activeLake.x > b.x && activeLake.x < b.x + b.w &&
          activeLake.y > b.y && activeLake.y < b.y + b.h
        ) {
          hitBucket = b;
        }
      });

      if (hitBucket) {
        if (hitBucket.name === activeLake.type) {
          sound.playCorrect();
          score += 10 + streak * 2;
          streak++;
          correctCount++;
          addParticles(activeLake.x, activeLake.y, hitBucket.color);
          showToast(`Doğru! ${activeLake.name} ➔ ${activeLake.type} ("${activeLake.key}")`, true);
          remainingPool = remainingPool.filter(l => l.name !== activeLake.name);
          updateStats();
          setTimeout(spawnNextLake, 600);
        } else {
          sound.playWrong();
          streak = 0;
          wrongCount++;
          showToast(`Yanlış! ${activeLake.name} aslında bir ${activeLake.type} (${activeLake.key}).`, false);
          updateStats();
          activeLake.x = canvas.width / 2;
          activeLake.y = 65;
        }
      } else {
        activeLake.x = canvas.width / 2;
        activeLake.y = 65;
      }
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', handleStart, { passive: false });
    canvas.addEventListener('touchmove', handleMove, { passive: false });
    canvas.addEventListener('touchend', handleEnd);

    // --- MODE 2: QUIZ ---
    function setupQuiz() {
      hideToast();
      if (remainingPool.length === 0) remainingPool = [...LAKES_DATA];
      currentQuizItem = remainingPool[Math.floor(Math.random() * remainingPool.length)];

      document.getElementById('quiz-title').textContent = currentQuizItem.name;
      document.getElementById('quiz-clue').textContent = `💡 Kodlama İpucu: "...${currentQuizItem.key}..."`;

      const grid = document.getElementById('quiz-options');
      grid.innerHTML = '';

      CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = cat.name;
        btn.onclick = () => checkQuiz(cat.name, btn);
        grid.appendChild(btn);
      });
    }

    function checkQuiz(selected, btn) {
      const btns = document.querySelectorAll('#quiz-options .option-btn');
      btns.forEach(b => b.style.pointerEvents = 'none');

      if (selected === currentQuizItem.type) {
        btn.classList.add('correct');
        sound.playCorrect();
        score += 15;
        streak++;
        correctCount++;
        showToast(`Tebrikler! ${currentQuizItem.name} ➔ ${currentQuizItem.type}`, true, true);
        remainingPool = remainingPool.filter(l => l.name !== currentQuizItem.name);
      } else {
        btn.classList.add('wrong');
        sound.playWrong();
        streak = 0;
        wrongCount++;
        btns.forEach(b => { if (b.textContent === currentQuizItem.type) b.classList.add('correct'); });
        showToast(`Yanlış! ${currentQuizItem.name} bir ${currentQuizItem.type} örneğidir.`, false, true);
      }
      updateStats();
    }

    // --- MODE 3: MNEMONIC ---
    function setupMnemonic() {
      hideToast();
      if (remainingPool.length === 0) remainingPool = [...LAKES_DATA];
      currentQuizItem = remainingPool[Math.floor(Math.random() * remainingPool.length)];

      document.getElementById('mnem-title').textContent = `"${currentQuizItem.key}"`;

      const grid = document.getElementById('mnem-options');
      grid.innerHTML = '';

      let choices = [currentQuizItem];
      while (choices.length < 4) {
        const r = LAKES_DATA[Math.floor(Math.random() * LAKES_DATA.length)];
        if (!choices.some(c => c.name === r.name)) choices.push(r);
      }
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = item.name;
        btn.onclick = () => checkMnemonic(item.name, btn);
        grid.appendChild(btn);
      });
    }

    function checkMnemonic(selectedName, btn) {
      const btns = document.querySelectorAll('#mnem-options .option-btn');
      btns.forEach(b => b.style.pointerEvents = 'none');

      if (selectedName === currentQuizItem.name) {
        btn.classList.add('correct');
        sound.playCorrect();
        score += 20;
        streak++;
        correctCount++;
        showToast(`Tebrikler! "${currentQuizItem.key}" ➔ ${currentQuizItem.name}`, true, true);
      } else {
        btn.classList.add('wrong');
        sound.playWrong();
        streak = 0;
        wrongCount++;
        btns.forEach(b => { if (b.textContent === currentQuizItem.name) b.classList.add('correct'); });
        showToast(`Yanlış! "${currentQuizItem.key}" kodlaması ${currentQuizItem.name} içindir.`, false, true);
      }
      updateStats();
    }

    feedbackNext.onclick = () => {
      if (currentMode === 'quiz') setupQuiz();
      if (currentMode === 'mnemonic') setupMnemonic();
    };

    function initMode() {
      hideToast();
      if (currentMode === 'canvas') { resizeCanvas(); spawnNextLake(); }
      else if (currentMode === 'quiz') { setupQuiz(); }
      else if (currentMode === 'mnemonic') { setupMnemonic(); }
    }

    // DICTIONARY MODAL
    const modal = document.getElementById('dict-modal');
    document.getElementById('btn-dict').onclick = () => {
      const list = document.getElementById('dict-list');
      list.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const lakes = LAKES_DATA.filter(l => l.type === cat.name).map(l => l.name).join(', ');
        const card = document.createElement('div');
        card.className = 'dict-card';
        card.style.borderLeftColor = cat.color;
        card.innerHTML = `
          <h4 style="color: ${cat.color}">${cat.name}</h4>
          <div class="dict-lakes"><strong>Göller:</strong> ${lakes}</div>
          <div class="dict-story">💬 <strong>Kodlama Hikayesi:</strong> ${cat.story}</div>
        `;
        list.appendChild(card);
      });
      modal.style.display = 'flex';
    };

    document.getElementById('close-modal').onclick = () => modal.style.display = 'none';

    document.getElementById('btn-restart').onclick = () => {
      score = 0; streak = 0; correctCount = 0; wrongCount = 0;
      remainingPool = [...LAKES_DATA];
      updateStats();
      initMode();
    };

    // INIT
    updateStats();
    setTimeout(() => {
      resizeCanvas();
      spawnNextLake();
      renderCanvas();
    }, 100);
  </script>
</body>
</html>
